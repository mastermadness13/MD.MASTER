<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block doc_title %}نموذج معدل الأداء الموحد{% endblock %}</title>
    {% include 'shared/components/theme_init.html' %}
    {% include 'faculty_performance/_official_document_styles.html' %}
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #e8e8e8;
            margin: 0;
            padding: 20px;
            font-family: var(--user-font-family, 'Times New Roman', 'Traditional Arabic', 'Simplified Arabic', 'Tahoma', Arial, sans-serif);
        }

        .document-page {
            background: #ffffff;
            width: 210mm;
            min-height: 297mm;
            padding: 18mm 16mm;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        @media print {
            /* One A4 page holds the document, nothing else. */
            html,
            body {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                overflow: hidden !important;
            }

            /* Screen UI (print button, back link, scripts) never prints. */
            body > *:not(.document-page) {
                display: none !important;
            }

        .document-page {
            display: block !important;
            width: 210mm !important;
            height: 297mm !important;
            min-height: 297mm !important;
            max-height: 297mm !important;
            margin: 0 !important;
            padding: 12mm !important;
                background: #fff !important;
                box-shadow: none !important;
                border: none !important;
                overflow: hidden !important;
                page-break-after: avoid !important;
                page-break-before: avoid !important;
                break-after: avoid-page !important;
                break-before: avoid-page !important;
            }

            /* Never spill onto a second sheet. */
            .document-page table {
                width: 100% !important;
                max-width: 100% !important;
                border-collapse: collapse !important;
            }
            .document-page tr,
            .document-page td,
            .document-page th {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            .document-page a {
                color: inherit !important;
                text-decoration: none !important;
            }

            .no-print {
                display: none !important;
            }
        }

        .print-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            transition: background-color 0.2s;
        }

        .print-btn:hover {
            background-color: #1d4ed8;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background-color: #4b5563;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #374151;
        }

        @media screen and (max-width: 860px) {
            .print-btn, .back-btn {
                position: static;
                display: inline-block;
                margin: 0 0 12px 8px;
            }
        }

        {# Child pages (print_course.html, leaves_report.html) override @page
           and the sheet box. Declared last so their declarations win over the
           defaults above. #}
        {% block doc_styles %}{% endblock %}
    </style>
</head>
<body>

    <button type="button" class="print-btn no-print" onclick="window.printDocument()">طباعة النموذج</button>
    {% block back_link %}{% endblock %}

    <div class="document-page">
        {% block doc_body %}{% endblock %}
    </div>

    {% block doc_scripts %}{% endblock %}
    <script defer src="{{ static_asset('js/shared/doc_page_fit.js') }}"></script>
    <script defer src="{{ static_asset('js/shared/print_document_fit.js') }}"></script>

</body>
</html>
