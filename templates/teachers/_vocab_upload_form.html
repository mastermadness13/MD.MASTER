<form method="POST" action="{{ url_for('teacher_pages.super_admin_vocabulary_upload') }}" enctype="multipart/form-data"
      onsubmit="var f=this.elements['file']; if(!f.files.length){ alert('يرجى اختيار ملف PDF أولاً'); return false; }">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="course_id" value="{{ course.id }}">
  <input type="file" name="file" accept=".pdf" required
         class="block w-full text-sm font-bold text-on-surface file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 cursor-pointer">
  <button type="submit"
          class="mt-3 flex items-center gap-2 bg-primary hover:bg-primary/90 text-on-primary px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-sm cursor-pointer">
    <span class="material-symbols-outlined text-lg">upload_file</span>
    رفع المفردات
  </button>
</form>
