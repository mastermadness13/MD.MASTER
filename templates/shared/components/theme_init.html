<script>
/* Runs before first paint so a dark-mode user never sees a white flash.
   Mirrors static/js/theme.js: sets data-theme / data-theme-mode / data-density
   / data-corner and the custom accent hue. Keep the two in sync — this copy
   must stay dependency-free and inline so it executes immediately. */
(function () {
  var doc = document.documentElement;
  var MODES = ['light', 'dark', 'system', 'custom'];
  var DENSITIES = ['comfortable', 'compact'];
  var CORNERS = ['soft', 'sharp', 'round'];

  var mode = 'light';
  try {
    var saved = localStorage.getItem('ropely-theme');
    if (MODES.indexOf(saved) !== -1) mode = saved;
  } catch (e) {}

  var prefs = {};
  try {
    prefs = JSON.parse(localStorage.getItem('ropely-theme-prefs') || '{}') || {};
  } catch (e) { prefs = {}; }

  var dark;
  if (mode === 'dark') {
    dark = true;
  } else if (mode === 'light') {
    dark = false;
  } else if (mode === 'custom') {
    dark = prefs.base === 'dark';
  } else {
    dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  var density = DENSITIES.indexOf(prefs.density) === -1 ? 'comfortable' : prefs.density;
  var corner = CORNERS.indexOf(prefs.corner) === -1 ? 'soft' : prefs.corner;
  var hue = typeof prefs.hue === 'number' && isFinite(prefs.hue) ? prefs.hue : 280;

  var theme = dark ? 'dark' : 'light';
  doc.setAttribute('data-theme', theme);
  doc.setAttribute('data-resolved-theme', theme);
  doc.setAttribute('data-theme-mode', mode);
  doc.setAttribute('data-density', density);
  doc.setAttribute('data-corner', corner);
  doc.style.setProperty('--user-hue', String(hue));
  /* Tailwind darkMode: 'class' — mirror data-theme so dark: utilities work. */
  doc.classList.toggle('dark', dark);
})();
</script>
