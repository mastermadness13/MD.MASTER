<script>
/* Runs before first paint so a dark-mode user never sees a white flash.
   Mirrors static/js/theme.js: sets data-theme / data-theme-mode / data-density
   / data-corner and the custom accent hue. Keep the two in sync — this copy
   must stay dependency-free and inline so it executes immediately. */
(function () {
  var doc = document.documentElement;
  var MODES = ['light', 'dark', 'system', 'custom'];
  var DENSITIES = ['comfortable', 'compact'];
  var CORNERS = ['soft', 'sharp', 'round'];
  var FONT_FAMILIES = {
    'Cairo': '"Cairo", sans-serif',
    'Tajawal': '"Tajawal", sans-serif',
    'Almarai': '"Almarai", sans-serif',
    'IBM Plex Sans Arabic': '"IBM Plex Sans Arabic", sans-serif',
    'Noto Kufi Arabic': '"Noto Kufi Arabic", sans-serif'
  };

  function normalizeFontFamily(value) {
    if (typeof value !== 'string') return null;
    var normalized = value.trim().toLowerCase().replace(/[-_]+/g, ' ').replace(/\s+/g, ' ');
    var families = Object.keys(FONT_FAMILIES);
    for (var i = 0; i < families.length; i++) {
      if (families[i].toLowerCase() === normalized ||
          FONT_FAMILIES[families[i]].toLowerCase() === value.trim().toLowerCase()) return families[i];
    }
    return null;
  }

  function normalizeFontSize(value) {
    if (typeof value !== 'number' && typeof value !== 'string') return null;
    if (typeof value === 'string' && !/^(?:\d{1,2})(?:\.0|\.5)?$/.test(value.trim())) return null;
    if (typeof value === 'string') value = Number(value.trim());
    if (!isFinite(value) || value < 12 || value > 22) return null;
    return Math.abs(value * 2 - Math.round(value * 2)) < 0.000001 ? value : null;
  }

  function normalizeHexColor(value) {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value.toLowerCase() : null;
  }

  function hexRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)
    ];
  }

  function relativeLuminance(rgb) {
    function linearize(channel) {
      channel /= 255;
      return channel <= 0.04045 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
    }
    return 0.2126 * linearize(rgb[0]) + 0.7152 * linearize(rgb[1]) + 0.0722 * linearize(rgb[2]);
  }

  function contrastRatio(first, second) {
    var firstLuminance = relativeLuminance(hexRgb(first));
    var secondLuminance = relativeLuminance(hexRgb(second));
    return (Math.max(firstLuminance, secondLuminance) + 0.05) /
      (Math.min(firstLuminance, secondLuminance) + 0.05);
  }

  function readableColor(candidate, backgrounds) {
    if (backgrounds.every(function (background) {
      return contrastRatio(candidate, background) >= 4.5;
    })) return candidate;
    var blackScore = Math.min.apply(null, backgrounds.map(function (background) {
      return contrastRatio('#000000', background);
    }));
    var whiteScore = Math.min.apply(null, backgrounds.map(function (background) {
      return contrastRatio('#ffffff', background);
    }));
    return blackScore >= whiteScore ? '#000000' : '#ffffff';
  }

  function customAccentRgb(hue, dark) {
    var saturation = dark ? 0.68 : 0.58;
    var lightness = dark ? 0.66 : 0.42;
    var chroma = (1 - Math.abs(2 * lightness - 1)) * saturation;
    var hueSection = hue / 60;
    var secondary = chroma * (1 - Math.abs(hueSection % 2 - 1));
    var rgb;
    if (hueSection < 1) rgb = [chroma, secondary, 0];
    else if (hueSection < 2) rgb = [secondary, chroma, 0];
    else if (hueSection < 3) rgb = [0, chroma, secondary];
    else if (hueSection < 4) rgb = [0, secondary, chroma];
    else if (hueSection < 5) rgb = [secondary, 0, chroma];
    else rgb = [chroma, 0, secondary];
    var offset = lightness - chroma / 2;
    return [rgb[0], rgb[1], rgb[2]].map(function (channel) {
      return (channel + offset) * 255;
    });
  }

  var mode = 'light';
  try {
    var saved = localStorage.getItem('ropely-theme');
    if (MODES.indexOf(saved) !== -1) mode = saved;
  } catch (e) {}

  var prefs = {};
  try {
    prefs = JSON.parse(localStorage.getItem('ropely-theme-prefs') || '{}') || {};
  } catch (e) { prefs = {}; }

  var dark;
  if (mode === 'dark') {
    dark = true;
  } else if (mode === 'light') {
    dark = false;
  } else if (mode === 'custom') {
    dark = prefs.base === 'dark';
  } else {
    dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  var density = DENSITIES.indexOf(prefs.density) === -1 ? 'comfortable' : prefs.density;
  var corner = CORNERS.indexOf(prefs.corner) === -1 ? 'soft' : prefs.corner;
  var hue = typeof prefs.hue === 'number' && isFinite(prefs.hue)
    ? Math.max(0, Math.min(359, Math.round(prefs.hue)))
    : 280;
  var fontFamily = normalizeFontFamily(prefs.fontFamily) || 'Cairo';
  var fontSize = normalizeFontSize(prefs.fontSize);
  if (fontSize === null) fontSize = 16;
  var darkCustomBase = mode === 'custom' && prefs.base === 'dark';
  var pageColor = normalizeHexColor(prefs.pageColor) || (darkCustomBase ? '#14101c' : '#f7f9ff');
  var cardColor = normalizeHexColor(prefs.cardColor) || (darkCustomBase ? '#241e31' : '#ffffff');
  var textColor = normalizeHexColor(prefs.textColor) || (darkCustomBase ? '#ece6f4' : '#181c20');
  var mutedColor = normalizeHexColor(prefs.mutedColor) || (darkCustomBase ? '#c9c0d9' : '#4c4452');
  var modalColor = normalizeHexColor(prefs.modalColor) || cardColor;
  var borderColor = normalizeHexColor(prefs.borderColor) || (darkCustomBase ? '#475569' : '#d1d5db');
  var inverseTextColor = normalizeHexColor(prefs.inverseTextColor) ||
    readableColor('#ffffff', [textColor]);
  var buttonColor = normalizeHexColor(prefs.buttonColor) || '#7c3aed';
  var buttonStyle = ['filled', 'subtle', 'outline'].indexOf(prefs.buttonStyle) === -1
    ? 'filled' : prefs.buttonStyle;

  var theme = dark ? 'dark' : 'light';
  doc.setAttribute('data-theme', theme);
  doc.setAttribute('data-resolved-theme', theme);
  doc.setAttribute('data-theme-mode', mode);
  doc.setAttribute('data-density', density);
  doc.setAttribute('data-corner', corner);
  doc.style.setProperty('--user-hue', String(hue));
  doc.style.setProperty('--user-font-family', FONT_FAMILIES[fontFamily]);
  doc.style.setProperty('--user-font-size', fontSize + 'px');
  doc.style.fontSize = fontSize + 'px';
  doc.style.setProperty('--user-page-color', pageColor);
  doc.style.setProperty('--user-card-color', cardColor);
  doc.style.setProperty('--user-modal-color', modalColor);
  doc.style.setProperty('--user-border-color', borderColor);
  doc.style.setProperty('--user-text-color', readableColor(textColor, [pageColor]));
  doc.style.setProperty('--user-card-text-color', readableColor(textColor, [cardColor]));
  doc.style.setProperty('--user-modal-text-color', readableColor(textColor, [modalColor]));
  doc.style.setProperty('--user-muted-color', readableColor(mutedColor, [pageColor]));
  doc.style.setProperty('--user-card-muted-color', readableColor(mutedColor, [cardColor]));
  doc.style.setProperty('--user-modal-muted-color', readableColor(mutedColor, [modalColor]));
  doc.style.setProperty(
    '--user-inverse-text-color',
    readableColor(inverseTextColor, [readableColor(textColor, [pageColor])])
  );
  doc.style.setProperty('--user-button-color', buttonColor);
  doc.style.setProperty('--user-button-fg', readableColor('#ffffff', [buttonColor]) === '#ffffff' ? '#ffffff' : '#000000');
  doc.style.setProperty('--user-button-text', readableColor(buttonColor, [pageColor, cardColor]));
  doc.setAttribute('data-button-style', buttonStyle);
  doc.style.setProperty('--custom-button-bg', 'var(--user-accent)');
  var luminance = relativeLuminance(customAccentRgb(hue, dark));
  var blackContrast = (luminance + 0.05) / 0.05;
  var whiteContrast = 1.05 / (luminance + 0.05);
  doc.style.setProperty('--custom-button-fg', blackContrast >= whiteContrast ? '#000000' : '#ffffff');
  /* Tailwind darkMode: 'class' — mirror data-theme so dark: utilities work. */
  doc.classList.toggle('dark', dark);
})();
</script>
